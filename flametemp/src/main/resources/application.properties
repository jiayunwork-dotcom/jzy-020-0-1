spring.application.name=flametemp
server.port=8080

# In-process SQLite only; no external database container.
spring.datasource.url=jdbc:sqlite:${FLAMETEMP_DB:./flametemp.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# HikariCP pools a single file connection: serialized access, WAL enabled in code.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL

spring.jackson.default-property-inclusion=always
